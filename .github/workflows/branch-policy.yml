# Branch policy (ADR-0009, ADR-0013): only `development` of this repository may be merged into `main`.
#
# Add the `source-branch` check to the required status checks of the `protect-main` ruleset
# only. Pull requests into any other branch pass it without a source check.
name: Branch policy

on:
  # Every base branch, not only `main`: when an open pull request's base changes, the `edited`
  # run reports for the new base. With a `branches: [main]` filter, a pull request opened
  # against `main` and then moved to `development` would keep its failed run, and re-running
  # that run repeats the old event, base `main` included.
  pull_request:
    types: [opened, reopened, synchronize, edited]

# The job only compares names; it needs no token rights and checks out no code.
permissions: {}

jobs:
  source-branch:
    name: source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Only development may be merged into main
        # Values go through `env`, never straight into the script: branch names can contain
        # shell characters.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "OK: base is $BASE_REF; only pull requests into main are restricted"
          elif [ "$HEAD_REF" = "development" ] && [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            echo "OK: $HEAD_REPO:$HEAD_REF -> main"
          else
            echo "::error title=Wrong source branch::Pull requests into main must come from development in $THIS_REPO, not $HEAD_REPO:$HEAD_REF. Change the base branch to development."
            exit 1
          fi
